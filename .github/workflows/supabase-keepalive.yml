```yaml
name: Supabase Keep Alive

on:
  schedule:
    # Jalan setiap hari pukul 09:00 UTC (16:00 WIB)
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -sS \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/students?select=id&limit=1"
```
